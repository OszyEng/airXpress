<div class="container py-5">
  <div class="card shadow-lg border-0" style="border-radius: 16px;">
    <div class="card-header bg-primary text-white text-center py-4">
      <h3 class="mb-0">Cargar Reservas desde XML</h3>
    </div>
    <div class="card-body p-5">

      <div class="text-center mb-4">
        <input type="file" class="form-control form-control-lg" accept=".xml" (change)="onFileSelected($event)">
      </div>

      <div *ngIf="loading" class="text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Procesando archivo...</p>
      </div>

      <div *ngIf="result" class="alert alert-info">
        <strong>Resultado:</strong><br>
        Carga exitosa: {{ result.success }}<br>
        Errores: {{ result.errors }}<br>
        Tiempo: {{ result.time }} ms
      </div>

      <button class="btn btn-primary w-100" (click)="loadDiagram()" [disabled]="!result">
        Ver Diagrama de Asientos
      </button>
    </div>
  </div>
</div>
