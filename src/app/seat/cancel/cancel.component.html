<div class="container py-5">
  <div class="card shadow-lg border-0" style="border-radius: 16px;">
    <div class="card-header bg-primary text-white text-center py-4">
      <h3 class="mb-0">Cancelar Reserva</h3>
    </div>
    <div class="card-body p-5">
      <div class="border p-4 rounded bg-light h-100">
        <h5 class="text-warning mb-3">Tus Reservas</h5>
        <div *ngIf="reservations?.length; else none">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Asiento</th>
                <th>Pasajero</th>
                <th>CUI</th>
                <th>Clase</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let r of reservations">
                <td>{{ r.seat_number || r.seat || r.seatNumber }}</td>
                <td>{{ r.passenger_name || r.passenger || r.name }}</td>
                <td>{{ r.cui }}</td>
                <td>{{ r.class_type || r.class }}</td>
                <td>
                  <button class="btn btn-sm btn-danger" (click)="cancelReservationFor(r)">Cancelar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <ng-template #none>
          <div class="alert alert-info">No tienes reservas para cancelar.</div>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div #actionToast id="actionToastCancel" class="toast align-items-center text-white bg-primary border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">
          <strong id="actionMessageCancel"></strong>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>
</div>
