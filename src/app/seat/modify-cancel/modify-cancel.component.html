<div class="container py-5">
  <div class="card shadow-lg border-0" style="border-radius: 16px;">
    <div class="card-header bg-primary text-white text-center py-4">
      <h3 class="mb-0">Modificar o Cancelar Reserva</h3>
    </div>
    <div class="card-body p-5">

      <div class="row g-4">
        <!-- Modificar -->
        <div class="col-md-6">
          <div class="border p-4 rounded bg-light h-100">
            <h5 class="text-primary mb-3">Modificar Asiento</h5>
            <form (ngSubmit)="modifyReservation()" #modifyForm="ngForm">
              <div class="form-group mb-3">
                <label>CUI</label>
                <input type="text" class="form-control" [(ngModel)]="modifyCUI" name="cui" required>
              </div>
              <div class="form-group mb-3">
                <label>Asiento Actual</label>
                <input type="text" class="form-control" [(ngModel)]="modifySeat" name="seat" required>
              </div>
              <div class="form-group mb-3">
                <label>Nuevo Asiento</label>
                <input type="text" class="form-control" [(ngModel)]="newSeat" name="newSeat" required>
              </div>
              <button type="submit" class="btn btn-warning w-100" [disabled]="!modifyForm.valid">
                Modificar (+10%)
              </button>
            </form>
          </div>
        </div>

        <!-- Cancelar -->
        <div class="col-md-6">
          <div class="border p-4 rounded bg-light h-100">
            <h5 class="text-warning mb-3">Cancelar Reserva</h5>
            <form (ngSubmit)="cancelReservation()" #cancelForm="ngForm">
              <div class="form-group mb-3">
                <label>CUI</label>
                <input type="text" class="form-control" [(ngModel)]="cancelCUI" name="cui" required>
              </div>
              <div class="form-group mb-3">
                <label>Asiento</label>
                <input type="text" class="form-control" [(ngModel)]="cancelSeat" name="seat" required>
              </div>
              <button type="submit" class="btn btn-warning w-100" [disabled]="!cancelForm.valid">
                Cancelar Reserva
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div #actionToast class="toast align-items-center text-white bg-primary border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">
              <strong id="actionMessage"></strong>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
