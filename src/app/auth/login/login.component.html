<div class="min-vh-100 d-flex align-items-center justify-content-center bg-gradient-primary p-3">
  <div class="card shadow-lg border-0" style="max-width: 420px; width: 100%; border-radius: 16px;">
    <div class="card-body p-5">

      <div class="text-center mb-4">
        <div class="logo-placeholder mx-auto mb-3"
             style="background: url('/assets/images/airxpress-logo.png') no-repeat center/contain;
                    width: 100px; height: 50px;"></div>
        <h2 class="fw-bold">
          <span class="text-primary">AIR</span><span class="text-warning">XPRESS</span>
        </h2>
        <p class="text-muted mt-2">Inicia sesión para continuar</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label text-dark">Correo</label>
          <input type="email" class="form-control form-control-lg" 
                 [(ngModel)]="email" name="email" required email>
        </div>

        <div class="mb-3">
          <label class="form-label text-dark">Contraseña</label>
          <input type="password" class="form-control form-control-lg" 
                 [(ngModel)]="password" name="password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3"
                [disabled]="!loginForm.valid">
          Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-muted mb-0">
          ¿No tienes cuenta? 
          <a routerLink="/register" class="text-warning fw-bold text-decoration-none">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div #errorToast class="toast align-items-center text-black bg-white border border-warning" role="alert">
    <div class="d-flex">
      <div class="toast-body">
        <strong>Error:</strong> <span id="errorMessage"></span>
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>
