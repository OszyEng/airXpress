<div class="container py-5">
  <div class="card shadow-lg border-0" style="border-radius: 16px;">
    <div class="card-header bg-primary text-white text-center py-4">
      <h3 class="mb-0">Mis Reservas</h3>
    </div>
    <div class="card-body p-5">
      <div *ngIf="reservations?.length; else empty">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Asiento</th>
              <th>Pasajero</th>
              <th>CUI</th>
              <th>Clase</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of reservations">
              <td>{{ r.seat_number || r.seat || r.seatNumber }}</td>
              <td>{{ r.passenger_name || r.passenger || r.name }}</td>
              <td>{{ r.cui }}</td>
              <td>{{ r.class_type || r.class }}</td>
              <td>Q{{ priceFor(r) | number:'1.0-0' }}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-2" (click)="goModify(r)">Modificar</button>
                <button class="btn btn-sm btn-outline-danger" (click)="goCancel(r)">Cancelar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <ng-template #empty>
        <div class="alert alert-info">No tienes reservas activas.</div>
      </ng-template>
    </div>
  </div>
</div>
